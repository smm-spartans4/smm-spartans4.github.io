<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17401A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="ff-header"></div>

<main class="ff-main">
  <section class="ff-card">
    <div class="ff-card-head">
      <h1>Next Up</h1>
      <a class="ff-small" href="schedule.html">Full schedule</a>
    </div>
    <div id="upcoming"></div>
  </section>
</main>

<script src="data/team-data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script>
(function () {
  'use strict';
  FF.ui.init();

  function h(tag, attrs, kids) { return FF.ui.h(tag, attrs, kids); }

  function fmtDate(iso) {
    if (!iso) return 'No date';
    var p = iso.split('-');
    var d = new Date(+p[0], +p[1] - 1, +p[2]);
    return d.toLocaleDateString(undefined,
      { weekday: 'long', month: 'long', day: 'numeric' });
  }

  function fmtTime(hhmm) {
    if (!hhmm) return '';
    var p = hhmm.split(':');
    var hour = parseInt(p[0], 10) || 0;
    var ampm = hour >= 12 ? 'pm' : 'am';
    return (hour % 12 || 12) + ':' + p[1] + ampm;
  }

  function positionIds(side) {
    var key = side === 'defense' ? 'defensePositions' : 'offensePositions';
    return (FF.store.settings()[key] || []).map(function (p) { return p.id; });
  }

  /* Every group that actually has somebody in it, listed down the page rather
     than run together on one line - a parent is looking for one name, and a
     comma-separated string of ten is the hardest possible way to find it. */
  function sideBlock(evt, side) {
    var groups = FF.store.LINEUP_GROUPS(side);
    var ids = positionIds(side);
    var rendered = [];

    for (var g = 0; g < groups; g++) {
      var players = FF.store.activeLineup(evt.id, g).players || {};
      var filled = ids.filter(function (pos) { return players[pos]; });
      if (!filled.length) continue;

      var rows = h('div', { 'class': 'ff-lineup-rows' });
      filled.forEach(function (pos) {
        rows.appendChild(h('div', { 'class': 'ff-lineup-row' }, [
          h('span', { 'class': 'ff-lineup-pos', text: pos }),
          h('span', { 'class': 'ff-lineup-name', text: players[pos].name })
        ]));
      });

      rendered.push(h('div', { 'class': 'ff-lineup-group' }, [
        h('div', { 'class': 'ff-lineup-grouphead', text: 'Group ' + (g + 1) }),
        rows
      ]));
    }

    if (!rendered.length) return null;

    var block = h('div', { 'class': 'ff-lineup-side' }, [
      h('div', { 'class': 'ff-lineup-sidehead',
        text: side === 'defense' ? 'Defense' : 'Offense' })
    ]);
    rendered.forEach(function (g) { block.appendChild(g); });
    return block;
  }

  function eventBlock(evt) {
    var block = h('div', { 'class': 'ff-upnext' });

    block.appendChild(h('div', { 'class': 'ff-evt-title' }, [
      h('span', { 'class': 'ff-pill' + (evt.type === 'game' ? ' is-game' : ''),
        text: evt.type === 'game' ? 'Game' : 'Practice' }),
      h('strong', { text: fmtDate(evt.date) }),
      h('span', { 'class': 'ff-muted', text: fmtTime(evt.startTime) })
    ]));

    var where = evt.location || 'Location TBD';
    if (evt.type === 'game' && evt.opponent) where += '  ·  vs ' + evt.opponent;
    block.appendChild(h('div', { 'class': 'ff-small ff-muted', text: where }));

    var caps = (evt.captainRosterPlayerIds || [])
      .map(function (id) { var p = FF.store.playerById(id); return p ? p.name : null; })
      .filter(Boolean);
    if (caps.length) {
      block.appendChild(h('div', { 'class': 'ff-small ff-upnext-line' }, [
        h('strong', { text: 'Captains: ' }),
        h('span', { text: caps.join('  &  ') })
      ]));
    }

    var offense = sideBlock(evt, 'offense');
    var defense = sideBlock(evt, 'defense');
    if (offense || defense) {
      var sides = h('div', { 'class': 'ff-lineup-sides' });
      if (offense) sides.appendChild(offense);
      if (defense) sides.appendChild(defense);
      block.appendChild(sides);
    }

    block.appendChild(h('a', { 'class': 'ff-btn secondary ff-small ff-upnext-open',
      href: 'schedule.html?id=' + evt.id, text: 'Open' }));

    return block;
  }

  var host = document.getElementById('upcoming');
  var today = new Date().toISOString().slice(0, 10);
  var next = FF.store.eventsSorted()
    .filter(function (e) { return e.date >= today; })
    .slice(0, 2);

  if (!next.length) {
    host.appendChild(h('p', { 'class': 'ff-muted',
      text: 'Nothing on the calendar yet.' }));
  } else {
    next.forEach(function (evt) { host.appendChild(eventBlock(evt)); });
  }
})();
</script>
</body>
</html>
