<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play Viewer</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17401A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="ff-header"></div>

<main class="ff-main ff-viewer">

  <div class="ff-grid field-and-panel">

    <section class="ff-card">
      <div class="ff-card-head">
        <h1 id="playName">Play</h1>
        <a class="ff-small ff-coach-only" id="editLink" href="plays.html">Edit</a>
      </div>
      <div class="ff-field-wrap">
        <svg id="field" role="img" aria-label="Animated play diagram"></svg>
      </div>
      <div id="controls"></div>
      <div class="ff-legend" id="legendKeys">
        <span><i style="border-color:#E53935"></i> First down</span>
        <span><i style="border-color:#000000"></i> Line of scrimmage</span>
        <span class="ff-key js-offense-key"><b style="background:#FFEB3B"></b> Selling a fake</span>
        <span class="ff-key js-offense-key"><b style="background:#D32F2F"></b> Has the ball</span>
        <span class="ff-key js-defense-key"><i style="border-color:#FFC400"></i> Rush line</span>
        <span class="ff-key js-defense-key"><b style="background:#FFEB3B"></b> Zone</span>
      </div>
    </section>

    <section class="ff-card">
      <h2>Assignments</h2>
      <div id="legend"></div>
    </section>

  </div>

</main>

<script src="data/team-data.js"></script>
<script src="js/store.js"></script>
<script src="js/field.js"></script>
<script src="js/ui.js"></script>
<script src="js/routes.js"></script>
<script src="js/mirror.js"></script>
<script src="js/drills.js"></script>
<script src="js/ball.js"></script>
<script src="js/playback.js"></script>
<script src="js/announcer.js"></script>
<script src="js/mp4.js"></script>
<script src="js/recorder.js"></script>
<script src="js/viewer.js"></script>
<script>
(function () {
  'use strict';
  FF.ui.init();

  var params = new URLSearchParams(location.search);
  var drillId = params.get('drill');
  var id = params.get('id');

  /* A drill is an ordinary play once built, so everything below - playback,
     zones, the announcer, the MP4 export - works on it unchanged. */
  var drill = drillId && FF.drills ? FF.drills.byId(drillId) : null;
  var play = drill ? FF.drills.buildPlay(drill)
    : (id ? FF.store.playById(id) : FF.store.plays()[0]);

  if (!play) {
    document.querySelector('.ff-viewer').innerHTML =
      '<section class="ff-card"><div class="ff-stub"><p>That play could not be found.</p>'
      + '<p><a class="ff-btn" href="plays.html">Back to Plays</a></p></div></section>';
    return;
  }

  document.getElementById('playName').textContent = play.name;

  /* Selling a fake and carrying the ball are offensive states; the rush line
     and zone bubbles are defensive ones. Show only the half that applies. */
  var drop = play.side === 'defense' ? '.js-offense-key' : '.js-defense-key';
  Array.prototype.forEach.call(document.querySelectorAll(drop), function (el) {
    el.remove();
  });

  var edit = document.getElementById('editLink');
  edit.href = drill ? 'drill-editor.html?id=' + drill.id
                    : 'play-editor.html?id=' + play.id;

  FF.viewer.create({
    svg: document.getElementById('field'),
    controls: document.getElementById('controls'),
    legend: document.getElementById('legend'),
    play: play
  });
})();
</script>
</body>
</html>
