<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plays</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17401A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="ff-header"></div>

<main class="ff-main">
  <section class="ff-card">

    <div class="ff-card-head">
      <h1>Plays</h1>
      <span class="ff-pill" id="playCount"></span>
    </div>

    <div class="ff-toolbar ff-coach-only">
      <a class="ff-btn" href="play-editor.html?new=offense">+ Offensive Play</a>
      <a class="ff-btn secondary" href="play-editor.html?new=defense">+ Defensive Play</a>
    </div>

    <ul id="playList" class="ff-playgrid"></ul>

  </section>
</main>

<script src="data/team-data.js"></script>
<script src="js/store.js"></script>
<script src="js/field.js"></script>
<script src="js/ui.js"></script>
<script src="js/routes.js"></script>
<script src="js/mirror.js"></script>
<script src="js/drills.js"></script>
<script>
(function () {
  'use strict';
  FF.ui.init();

  var list = document.getElementById('playList');
  var SVGNS = 'http://www.w3.org/2000/svg';

  function h(tag, attrs, kids) { return FF.ui.h(tag, attrs, kids); }

  /* A still of the play at the snap: everyone where they line up, with their
     routes drawn, so a play is recognised by its shape and not by reading a
     list of near-identical names. */
  function thumbnail(play) {
    var svg = document.createElementNS(SVGNS, 'svg');
    svg.setAttribute('class', 'ff-thumb-svg');
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', play.name);

    var s = FF.store.settings();
    var ctx = FF.field.render(svg, {
      settings: s,
      view: FF.field.viewForThumb(s, play),
      lineOfScrimmageYard: play.lineOfScrimmageYard,
      showNoRush: play.side === 'defense',
      yardNumbers: false,      // unreadable at this size, and just noise
      labels: false
    });

    (play.players || []).forEach(function (pl) {
      if (FF.routes.isStatic(pl.route)) return;
      FF.field.drawRoute(ctx, pl.route, {
        lineOfScrimmageYard: play.lineOfScrimmageYard,
        color: '#FFFFFF',
        width: 0.3,
        opacity: 0.9
      });
    });

    FF.field.drawStartPositions(ctx, play);
    return svg;
  }

  function card(play) {
    var tags = (play.tags || []).filter(Boolean);

    var link = h('a', { 'class': 'ff-playcard-link',
      href: 'play-viewer.html?id=' + play.id });
    var thumb = h('div', { 'class': 'ff-playcard-thumb' });
    thumb.appendChild(thumbnail(play));
    link.appendChild(thumb);
    link.appendChild(h('div', { 'class': 'ff-playcard-name', text: play.name }));
    link.appendChild(h('div', { 'class': 'ff-playcard-meta' }, [
      h('span', { 'class': 'ff-pill' + (play.side === 'defense' ? ' is-game' : ''),
        text: play.side === 'defense' ? 'Defense' : 'Offense' }),
      h('span', { 'class': 'ff-small ff-muted', text: tags.join(', ') })
    ]));

    var order = h('div', { 'class': 'ff-playcard-order' }, [
      h('button', { type: 'button', 'class': 'ff-row-del', 'data-up': play.id,
        text: '◀', title: 'Move ' + play.name + ' earlier' }),
      h('button', { type: 'button', 'class': 'ff-row-del', 'data-down': play.id,
        text: '▶', title: 'Move ' + play.name + ' later' })
    ]);

    var tools = h('div', { 'class': 'ff-playcard-tools' }, [
      h('a', { 'class': 'ff-btn secondary ff-small',
        href: 'play-editor.html?id=' + play.id, text: 'Edit' }),
      h('button', { type: 'button', 'class': 'ff-btn secondary ff-small',
        'data-dupe': play.id, text: 'Copy' }),
      h('button', { type: 'button', 'class': 'ff-btn secondary ff-small',
        'data-flip': play.id, text: '⇄ Flip' }),
      h('button', { type: 'button', 'class': 'ff-row-del',
        'data-del': play.id, text: '×', title: 'Delete ' + play.name })
    ]);

    /* A parent gets the card and nothing else: no reorder, no edit, no delete. */
    if (!FF.ui.isCoach()) return h('li', { 'class': 'ff-playcard' }, [link]);
    return h('li', { 'class': 'ff-playcard' }, [link, order, tools]);
  }

  function render() {
    var plays = FF.store.plays();
    list.innerHTML = '';
    document.getElementById('playCount').textContent =
      plays.length + (plays.length === 1 ? ' play' : ' plays');

    if (!plays.length) {
      list.appendChild(h('li', { 'class': 'ff-empty' }, [
        h('p', { text: 'No plays yet.' }),
        h('p', { 'class': 'ff-small', text: 'Start one with the buttons above.' })
      ]));
      return;
    }

    /* Shown in the stored order, which the arrows control - so companion plays
       like a run and its matching pass sit side by side. */
    plays.forEach(function (p, i) {
      var el = card(p);
      var up = el.querySelector('[data-up]');
      var down = el.querySelector('[data-down]');
      if (up && i === 0) up.disabled = true;
      if (down && i === plays.length - 1) down.disabled = true;
      list.appendChild(el);
    });
  }

  list.addEventListener('click', function (e) {
    var up = e.target.closest('[data-up]');
    if (up) {
      FF.store.movePlay(up.getAttribute('data-up'), -1);
      FF.ui.refreshBanner();
      render();
      return;
    }

    var down = e.target.closest('[data-down]');
    if (down) {
      FF.store.movePlay(down.getAttribute('data-down'), 1);
      FF.ui.refreshBanner();
      render();
      return;
    }

    var dupe = e.target.closest('[data-dupe]');
    if (dupe) {
      var src = FF.store.playById(dupe.getAttribute('data-dupe'));
      var name = window.prompt('Name for the copy:', src.name + ' (copy)');
      if (name === null) return;
      var copy = FF.store.duplicatePlay(src.id, name.trim() || (src.name + ' (copy)'));
      if (copy) location.href = 'play-editor.html?id=' + copy.id;
      return;
    }

    var flip = e.target.closest('[data-flip]');
    if (flip) {
      var orig = FF.store.playById(flip.getAttribute('data-flip'));
      var suggested = FF.mirror.mirrorName(orig.name);
      var flipName = window.prompt('Name for the mirrored play:', suggested);
      if (flipName === null) return;
      var made = FF.store.mirrorPlayAsNew(orig.id, flipName.trim() || suggested);
      if (made) { FF.ui.refreshBanner(); render(); }
      return;
    }

    var del = e.target.closest('[data-del]');
    if (del) {
      var doomed = FF.store.playById(del.getAttribute('data-del'));
      if (!doomed) return;
      var built = (FF.drills ? FF.drills.usingPlay(doomed.id) : []);
      var warn = 'Delete "' + doomed.name + '"? This cannot be undone.';
      if (built.length) {
        warn += '\n\nThis will also delete ' + built.length + ' drill'
          + (built.length === 1 ? '' : 's') + ' built from it:\n  '
          + built.map(function (d) { return d.name; }).join('\n  ');
      }
      if (!window.confirm(warn)) return;
      FF.store.deletePlay(doomed.id);
      FF.ui.refreshBanner();
      render();
    }
  });

  render();
})();
</script>
</body>
</html>
