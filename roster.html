<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roster</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#17401A">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spartans">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
</head>
<body>
<div id="ff-header"></div>

<main class="ff-main">
  <section class="ff-card">

    <div class="ff-card-head">
      <h1>Roster</h1>
      <span class="ff-pill" id="rosterCount"></span>
    </div>

    <p class="ff-small ff-muted">
      <span class="ff-coach-only">Everything saves as you type. </span>Who plays which position is set per week
      over on <a href="schedule.html">Schedule</a>, not here &mdash; so you can
      shuffle the lineup by availability without touching your plays.
    </p>


    <div class="ff-roster-labels ff-small ff-muted" aria-hidden="true">
      <span>#</span><span>Name</span><span></span>
    </div>

    <ul id="rosterList" class="ff-list ff-roster"></ul>

    <div class="ff-toolbar ff-coach-only" style="margin-top:14px">
      <button id="addPlayer" class="ff-btn" type="button">+ Add Player</button>
      <span id="saveState" class="ff-savestate ff-small"></span>
    </div>

  </section>
</main>

<script src="data/team-data.js"></script>
<script src="js/store.js"></script>
<script src="js/field.js"></script>
<script src="js/ui.js"></script>
<script src="js/roster.js"></script>
</body>
</html>
